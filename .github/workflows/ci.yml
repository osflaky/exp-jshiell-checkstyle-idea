name: Build

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Run Checkstyle version-check script tests
      run: bash .github/scripts/check-checkstyle-version-test.sh

    - name: Set up Java 21
      uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: liberica

    - name: Build
      run: ./gradlew build
    name: build [ubuntu-latest--x64]
    timeout-minutes: 150
